name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Separate jobs so each shows up as its own check, and one failure doesn't hide the others.
jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Type-check app and specs
        run: pnpm vue-tsc --noEmit

      - name: Type-check Vite config
        run: pnpm exec tsc -p tsconfig.node.json --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # Not `pnpm build`: that re-runs vue-tsc, which the typecheck job already covers.
      - name: Vite production build
        run: pnpm vite build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test
